<!--?xml version="1.0" encoding="UTF-8"?-->
<svg width="1200" height="900" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">

    <defs>

        <linearGradient id="header" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0%" stop-color="#2563eb"></stop>
            <stop offset="100%" stop-color="#1d4ed8"></stop>
        </linearGradient>

        <style>

            .title{
                font-family:Segoe UI,Arial;
                font-size:34px;
                font-weight:bold;
                fill:white;
            }

            .subtitle{
                font-family:Segoe UI,Arial;
                font-size:18px;
                fill:white;
            }

            .box{
                fill:#ffffff;
                stroke:#cbd5e1;
                stroke-width:2;
                rx:12;
            }

            .boxTitle{
                font-family:Segoe UI;
                font-size:22px;
                font-weight:bold;
                fill:#0f172a;
            }

            .text{
                font-family:Segoe UI;
                font-size:17px;
                fill:#334155;
            }

            .footer{
                font-family:Segoe UI;
                font-size:16px;
                fill:#475569;
            }

            .line{
                stroke:#64748b;
                stroke-width:3;
                marker-end:url(#arrow);
            }

        </style>

        <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
            <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"></path>
        </marker>

    </defs>

    <!-- Header -->

    <rect x="0" y="0" width="1200" height="110" fill="url(#header)"></rect>

    <text x="600" y="48" text-anchor="middle" class="title">
        ORIGEN
    </text>

    <text x="600" y="82" text-anchor="middle" class="subtitle">
        Enterprise Full Stack Reference Application
    </text>

    <!-- Angular -->

    <rect class="box" x="270" y="150" width="660" height="95"></rect>

    <text class="boxTitle" x="600" y="185" text-anchor="middle">
        Angular 20 Frontend
    </text>

    <text class="text" x="600" y="218" text-anchor="middle">
        Angular Material • RxJS • Routing • Standalone Components
    </text>

    <!-- REST -->

    <line class="line" x1="600" y1="245" x2="600" y2="300"></line>

    <text class="text" x="620" y="280">
        HTTPS / REST API
    </text>

    <!-- Backend -->

    <rect class="box" x="180" y="315" width="840" height="240"></rect>

    <text class="boxTitle" x="600" y="350" text-anchor="middle">
        Spring Boot 3.5 Backend
    </text>

    <text class="text" x="220" y="395">
        • Controllers
    </text>

    <text class="text" x="220" y="430">
        • Services
    </text>

    <text class="text" x="220" y="465">
        • Repositories
    </text>

    <text class="text" x="220" y="500">
        • DTOs
    </text>

    <text class="text" x="220" y="535">
        • Entities
    </text>

    <text class="text" x="620" y="395">
        • Spring Security 6
    </text>

    <text class="text" x="620" y="430">
        • JWT Authentication
    </text>

    <text class="text" x="620" y="465">
        • RBAC
    </text>

    <text class="text" x="620" y="500">
        • OpenAPI / Swagger
    </text>

    <text class="text" x="620" y="535">
        • Global Exception Handling
    </text>

    <!-- JPA -->

    <line class="line" x1="600" y1="555" x2="600" y2="620"></line>

    <text class="text" x="620" y="595">
        Spring Data JPA / Hibernate
    </text>

    <!-- Database -->

    <rect class="box" x="290" y="640" width="620" height="110"></rect>

    <text class="boxTitle" x="600" y="680" text-anchor="middle">
        Microsoft SQL Server 2022
    </text>

    <text class="text" x="600" y="715" text-anchor="middle">
        Flyway Database Versioning
    </text>

    <!-- Footer -->

    <text x="600" y="830" text-anchor="middle" class="footer">

Java 21 • Maven • Docker • Docker Compose • Git • GitHub • REST API

    </text>

</svg>