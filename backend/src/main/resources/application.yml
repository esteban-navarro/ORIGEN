spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  application:
    name: ORIGEN

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

application:
  name: ORIGEN
  version: 1.1.0
  description: Modern Enterprise Full Stack Platform

springdoc:
  api-docs:
    path: /v3/api-docs

  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    display-request-duration: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always

info:
  app:
    name: ${application.name}
    version: ${application.version}
    description: ${application.description}

logging:
  level:
    root: INFO
    cl.origen.platform: DEBUG
    org.springframework.security: INFO
    org.flywaydb: INFO

security:

  jwt:
    issuer: ${JWT_ISSUER:origen}
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:PT1H}

  bootstrap:
    enabled: false

    admin:
      username:
      password:
      email:
      first-name:
      last-name:
